name: synk
channels:
  - conda-forge
  - bioconda
dependencies:
  # compleasm currently depends on sepp/dendropy builds that solve reliably
  # with Python 3.9, but conflict with the previous python>=3.10 spec.
  - python=3.9
  - pandas
  - matplotlib
  - compleasm>=0.2.8
  - miniprot
  - hmmer
  - r-base
  - r-xml
  - r-rsvg
  - r-devtools
  - r-remotes
  - r-grimport2
